<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - ISU-Challenge</title>
<meta name="description" content="Register your team for ISU-Challenge at ICSE 2027.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%98%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eef1f6;
    --line:#dbe1ea;
    --text:#161b22;
    --muted:#5b6472;
    --accent:#c97a00;
    --accent-fill:#ffb020;
    --on-accent:#1a1200;
    --track-a:#0f7aa8;
    --track-a-fill:#e4f3fa;
    --track-b-fill:#fff3e0;
    --shadow: 0 1px 0 rgba(20,25,35,.04);
    --radius-s:6px;
    --radius-m:12px;
    --font-display:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-headline:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0f14;
      --surface:#141a22;
      --surface-2:#1a212b;
      --line:#262f3d;
      --text:#e8ecf3;
      --muted:#8e97a8;
      --accent:#ffb020;
      --accent-fill:#ffb020;
      --on-accent:#1a1200;
      --track-a:#54c2ee;
      --track-a-fill:#122733;
      --track-b-fill:#26200f;
      --shadow: 0 1px 0 rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0f14;
    --surface:#141a22;
    --surface-2:#1a212b;
    --line:#262f3d;
    --text:#e8ecf3;
    --muted:#8e97a8;
    --accent:#ffb020;
    --accent-fill:#ffb020;
    --on-accent:#1a1200;
    --track-a:#54c2ee;
    --track-a-fill:#122733;
    --track-b-fill:#26200f;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:16.5px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  [hidden]{display:none !important;}
  a{color:var(--accent);}
  a:focus-visible, button:focus-visible, summary:focus-visible, details:focus-visible{
    outline:2px solid var(--accent-fill);
    outline-offset:2px;
  }
  h1,h2,h3,h4{
    font-family:var(--font-headline);
    font-weight:700;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
    color:var(--text);
  }
  p{margin:0;}
  ul,ol{margin:0;padding:0;}
  li{list-style:none;}
  code, .mono{font-family:var(--font-mono);}
  .container{max-width:1180px;margin:0 auto;padding:0 28px;}
  @media (max-width:640px){.container{padding:0 18px;}}

  /* Header */
  .topbar{
    border-bottom:1px solid var(--line);
    background:var(--surface);
    padding:14px 0;
    position:sticky;
    top:0;
    z-index:100;
  }
  .topbar-inner{
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    color:var(--text);text-decoration:none;
    font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:4px;
  }
  .brand .dot{color:var(--accent);}
  .brand .tag{
    font-family:var(--font-mono);font-weight:600;font-size:10px;
    background:var(--accent-fill);color:var(--on-accent);
    padding:3px 6px;border-radius:3px;margin-left:8px;
  }
  .back-link{
    font-family:var(--font-mono);font-weight:600;font-size:12.5px;
    background:var(--accent-fill);color:var(--on-accent);
    padding:7px 14px;border-radius:6px;text-decoration:none;
    white-space:nowrap;
  }
  .back-link:hover{filter:brightness(1.06);}

  /* Form Styles */
  .register-section{
    padding:60px 0;
    min-height:calc(100vh - 100px);
  }
  .register-wrapper{
    max-width:600px;
    margin:0 auto;
  }
  .register-header{
    margin-bottom:40px;
    text-align:center;
  }
  .register-header h1{
    font-size:clamp(28px,4vw,42px);
    margin-bottom:12px;
  }
  .register-header p{
    color:var(--muted);
    font-size:16px;
    max-width:500px;
    margin:0 auto;
  }
  .register-form{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:40px;
  }
  @media (max-width:640px){
    .register-form{padding:28px;}
  }
  .form-group{
    margin-bottom:24px;
    display:flex;
    flex-direction:column;
  }
  .form-group label{
    font-weight:500;
    margin-bottom:8px;
    font-size:14px;
    color:var(--text);
  }
  .form-group input,
  .form-group textarea,
  .form-group select{
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    font-family:var(--font-body);
    font-size:15px;
    background:var(--surface);
    color:var(--text);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .form-group input::placeholder,
  .form-group textarea::placeholder{
    color:var(--muted);
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-fill);
  }
  .form-group textarea{
    resize:vertical;
    min-height:120px;
    font-family:var(--font-body);
  }
  .form-actions{
    display:flex;
    gap:12px;
    margin-top:32px;
  }
  .form-actions a,
  .form-actions button{
    flex:1;
  }
  .btn{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:13px;
    padding:11px 18px;
    border-radius:7px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--accent-fill);
    color:var(--on-accent);
  }
  .btn-primary:hover{
    filter:brightness(1.05);
  }
  .btn-ghost{
    border-color:var(--line);
    color:var(--text);
    background:var(--surface);
  }
  .btn-ghost:hover{
    border-color:var(--accent);
  }
  .form-note{
    font-size:13px;
    color:var(--muted);
    margin-top:16px;
    text-align:center;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="index.html">ISU<span class="dot">·</span>Challenge <span class="tag">ICSE 2027</span></a>
    <a class="back-link" href="index.html">← Back</a>
  </div>
</div>

<section class="register-section">
  <div class="container">
    <div class="register-wrapper">
      <div class="register-header">
        <h1>Register Your Team</h1>
        <p>Fill out the form below to register your team for the ISU-Challenge competition at ICSE 2027.</p>
      </div>

      <form class="register-form" action="https://formspree.io/f/mrpgagqy" method="POST">
        <div class="form-group">
          <label for="email">Email Address <span style="color:var(--accent);">*</span></label>
          <input type="email" id="email" name="email" required placeholder="contact@yourteam.com">
        </div>

        <div class="form-group">
          <label for="teamName">Team Name <span style="color:var(--accent);">*</span></label>
          <input type="text" id="teamName" name="Team Name" required placeholder="Your Team Name">
        </div>

        <div class="form-group">
          <label for="affiliation">Affiliation</label>
          <input type="text" id="affiliation" name="Affiliation" placeholder="University, Company, or Organization">
        </div>

        <div class="form-group">
          <label for="track">Track Selection <span style="color:var(--accent);">*</span></label>
          <select id="track" name="Track" required>
            <option value="">-- Select a track --</option>
            <option value="Track A">Track A - Test Generation
            </option>
            <option value="Track B">Track B - System Development</option>
            <option value="Both">Both Tracks</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Additional Message</label>
          <textarea id="message" name="Message" placeholder="Tell us about your team, relevant experience, or any questions you have..."></textarea>
        </div>

        <div class="form-actions">
          <a class="btn btn-ghost" href="index.html">Cancel</a>
          <button type="submit" class="btn btn-primary">Submit Registration</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
document.querySelector('.register-form').addEventListener('submit', function(e){
  const submitBtn = this.querySelector('button[type="submit"]');
  submitBtn.textContent = 'Submitting...';
  submitBtn.disabled = true;
});
</script>

</body>
</html>
